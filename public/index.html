<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shark Vision Dashboard</title>
    <style>
        body { font-family: sans-serif; background: #0f172a; color: #f8fafc; text-align: center; padding: 50px; }
        .card { background: #1e293b; padding: 30px; border-radius: 12px; max-width: 500px; margin: 0 auto; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        h1 { color: #38bdf8; margin-bottom: 10px; }
        p { color: #94a3b8; }
        .status { display: inline-block; padding: 8px 16px; background: #22c55e; color: #fff; border-radius: 20px; font-weight: bold; margin-top: 15px; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Shark Vision Dashboard</h1>
        <p>لوحة التحكم بالبوت جاهزة وتعمل بنجاح على السيرفر!</p>
        <div class="status">● السيرفر متصل (Online)</div>
    </div>
</body>
</html>
