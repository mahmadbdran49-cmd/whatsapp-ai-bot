<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shark Vision - WhatsApp AI Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
        body { background-color: #0b0f19; color: #e2e8f0; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .container { background: #161e2e; width: 100%; max-width: 600px; border-radius: 16px; padding: 30px; box-shadow: 0 20px 40px rgba(0,0,0,0.5); border: 1px solid #1f293d; }
        .header { text-align: center; margin-bottom: 25px; }
        .header h1 { color: #38bdf8; font-size: 28px; font-weight: 700; margin-bottom: 5px; }
        .header p { color: #94a3b8; font-size: 14px; }
        .status-card { display: flex; align-items: center; justify-content: space-between; background: #0f172a; padding: 15px 20px; border-radius: 12px; margin-bottom: 25px; border: 1px solid #1e293b; }
        .badge { display: inline-flex; align-items: center; gap: 8px; padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: bold; }
        .badge.offline { background: rgba(239, 68, 68, 0.2); color: #f87171; }
        .badge.online { background: rgba(34, 197, 94, 0.2); color: #4ade80; }
        .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
        .qr-section { background: #0f172a; padding: 20px; border-radius: 12px; text-align: center; margin-bottom: 25px; border: 1px solid #1e293b; min-height: 240px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .qr-section img { max-width: 200px; border-radius: 8px; border: 4px solid #ffffff; }
        .log-box { background: #090d16; border-radius: 8px; padding: 15px; height: 150px; overflow-y: auto; font-size: 12px; font-family: monospace; color: #a7f3d0; border: 1px solid #1e293b; text-align: right; }
        .log-entry { margin-bottom: 6px; border-bottom: 1px solid #111827; padding-bottom: 4px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Shark Vision AI</h1>
            <p>لوحة التحكم والربط المباشر بـ WhatsApp</p>
        </div>

        <div class="status-card">
            <span>حالة النظام:</span>
            <div id="status-badge" class="badge offline">
                <span class="dot"></span>
                <span id="status-text">غير متصل</span>
            </div>
        </div>

        <div class="qr-section" id="qr-container">
            <p id="qr-placeholder" style="color: #64748b;">جاري تجهيز سيرفر الواتساب وتوليد الرمز...</p>
            <img id="qr-image" src="" alt="QR Code" style="display: none;">
        </div>

        <h3 style="font-size: 14px; color: #94a3b8; margin-bottom: 10px;">سجل الأحداث المباشر (Logs):</h3>
        <div class="log-box" id="logs-container">
            <div class="log-entry">> جاري بدء الاتصال بالخادم...</div>
        </div>
    </div>

    <script>
        async function fetchStatus() {
            try {
                const res = await fetch('/api/status');
                const data = await res.json();

                const badge = document.getElementById('status-badge');
                const statusText = document.getElementById('status-text');
                const qrImg = document.getElementById('qr-image');
                const qrPlaceholder = document.getElementById('qr-placeholder');
                const logsBox = document.getElementById('logs-container');

                if (data.ready) {
                    badge.className = 'badge online';
                    statusText.innerText = 'متصل بنجاح';
                    qrImg.style.display = 'none';
                    qrPlaceholder.style.display = 'block';
                    qrPlaceholder.innerText = '● البوت مرتبط بالواتساب ويعمل الآن في الخلفية.';
                } else if (data.qr) {
                    badge.className = 'badge offline';
                    statusText.innerText = 'بانتظار المسح (Scan)';
                    qrPlaceholder.style.display = 'none';
                    qrImg.src = data.qr;
                    qrImg.style.display = 'block';
                } else {
                    badge.className = 'badge offline';
                    statusText.innerText = 'جاري التجهيز...';
                }

                if (data.logs && data.logs.length > 0) {
                    logsBox.innerHTML = data.logs.map(log => `<div class="log-entry">${log}</div>`).join('');
                }
            } catch (e) {
                console.error('Error fetching status:', e);
            }
        }

        setInterval(fetchStatus, 3000);
        fetchStatus();
    </script>
</body>
</html>
